name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t shotsync:${{ github.sha }} \
            -t shotsync:latest \
            .

      - name: Export image as archive
        run: docker save shotsync:latest | gzip > shotsync-image.tar.gz

      - name: Upload image archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 104.225.159.103
          username: root
          port: 28022
          key: ${{ secrets.SSH_KEY }}
          source: shotsync-image.tar.gz
          target: /tmp

      - name: Load image and restart container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 104.225.159.103
          username: root
          port: 28022
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            APP_NAME="shotsync"
            APP_DIR="/opt/shotsync"
            IMAGE_ARCHIVE="/tmp/shotsync-image.tar.gz"
            PORT=3000

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/data"

            docker load -i "$IMAGE_ARCHIVE"

            if docker ps -a --format '{{.Names}}' | grep -q "^${APP_NAME}$"; then
              docker rm -f "$APP_NAME"
            fi

            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p "${PORT}:${PORT}" \
              -v "$APP_DIR/data:/app/data" \
              -e AUTH_TOKEN="${{ secrets.AUTH_TOKEN }}" \
              shotsync:latest

            rm -f "$IMAGE_ARCHIVE"
